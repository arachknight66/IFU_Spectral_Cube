cube_path: /absolute/path/to/jwst_miri_ifu_cube.fits
output_dir: outputs
wmin: 5.0
wmax: 28.0

preprocessing:
  continuum_window: 101
  iterative_continuum: false
  continuum_sigma_clip: 3.0
  continuum_n_iter: 3
  savgol_window: 11
  savgol_polyorder: 3
  gaussian_sigma_channels: 1.5
  defringe: false
  defringe_period_min: 0.01
  defringe_period_max: 0.1
  defringe_max_components: 3
  apply_dq_mask: true
  bad_dq_flags: 1

extraction:
  mode: circular
  center_x: 25.0
  center_y: 30.0
  radius: 3.0
  statistic: mean
  percentile: 90.0
  # Uncomment for background subtraction:
  # background_inner_radius: 4.0
  # background_outer_radius: 7.0

peaks:
  prominence_sigma: 4.5
  height_sigma: 0.0
  resolving_power: 2500.0
  min_snr: 4.5
  use_cwt: false
  merge_cwt: true
  cwt_min_snr: 4.0
  local_snr_window: 50

identification:
  line_db_path: null
  z_min: -0.02
  z_max: 0.2
  dz: 0.0005
  abs_tolerance_micron: 0.008
  sigma_tolerance: 2.5
  min_confidence: 0.2

fitting:
  enabled: true
  window_half_width_micron: 0.08
  try_voigt: true
  deblend_radius_micron: 0.05

visualization:
  smoothing_comparison: true
  peaks_and_matches: true
  gaussian_fits: true
  redshift_histogram: true
  noise_profile: true
  emission_maps: true
  line_diagnostic_grid: true
  interactive_html: false
