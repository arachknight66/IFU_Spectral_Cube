[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ifu-spectral-cube"
version = "0.1.0"
description = "Research-grade spectral line identification pipeline for JWST MIRI IFU cubes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "JWST IFU Team" }
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "astropy>=6.0",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
web = [
  "flask>=3.0",
]

[project.scripts]
ifu-line-id = "ifu_spectral_cube.cli:main"
ifu-web = "ifu_spectral_cube.web.server:run_server"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ifu_spectral_cube = ["data/*.csv"]
